name: Seed Compliance Rules

# C1 · 合规规则灌库
#
# 为什么单独一个 workflow
# -------------------
# 灌库需要 Cloudflare 的 **D1 写权限**。而 deploy.yml 用的
# CLOUDFLARE_API_TOKEN 是**最小权限**的 —— 实测 `/d1/database` 返回 401
# (见 docs/deployment-info.md「为什么没给 D1 权限是有意的」)。
#
# 所以灌库用**一次性 dispatch** 跑, 需要 D1 写权限的 token。
# 如果 runner 上的 token 有 D1 权限, 直接跑; 没有则明确报错, 不静默跳过。
#
# ⚠️ 审核闸门
#   默认灌 review_status='pending' —— 未审核规则**不参与判定**, 安全。
#   要提升为 'reviewed' 必须传 mark-reviewed, 且**应已完成人工逐条校核**。
#
# 用法:
#   gh workflow run seed-compliance.yml
#   gh workflow run seed-compliance.yml -f mark-reviewed=true

on:
  workflow_dispatch:
    inputs:
      mark-reviewed:
        description: "标记为 reviewed(需已完成人工校核)"
        type: boolean
        default: false
  # 推 `seed/compliance` 分支自动跑 —— 本地没有 gh CLI / GitHub token 时,
  # 灌库也能通过 push 触发(workflow_dispatch 需要 API 调用)。
  # ⚠️ **不要加 paths 过滤器** —— paths 会让「只有空提交」的 push 不触发,
  #    而灌库最常的触发方式就是空提交(代码没变, 只是要重跑一次)。
  push:
    branches:
      - seed/compliance

jobs:
  seed:
    name: D1 · 合规规则灌库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成索引产物(articles.json 是抽取的输入)
        run: python build/export/ingest_minimax.py

      - name: 抽取规则候选
        # 从 articles.json 抽 (物质×动物×限量) 三元组
        run: python build/export/extract_compliance_rules.py

      - name: 灌库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARK_REVIEWED: ${{ vars.SEED_MARK_REVIEWED }}
        run: |
          # workflow_dispatch 用 inputs.mark-reviewed; push 触发时用
          # 仓库变量 SEED_MARK_REVIEWED(默认 false → 灌 pending, 安全)
          MARK="${MARK_REVIEWED:-false}"
          FLAGS=""
          if [ "${{ inputs.mark-reviewed }}" = "true" ] || [ "$MARK" = "true" ]; then
            echo "::warning::正在以 reviewed 状态灌库 —— 确认已完成人工逐条校核"
            FLAGS="--mark-reviewed"
          fi

          # ── 优先走 D1 REST API(bound params, 可控、可回读校验) ──
          # 失败输出写进 job summary —— GitHub API 无需认证也能读到,
          # 不用登录就能看 CI 到底报了什么。
          set -o pipefail
          if python build/export/seed_compliance.py --remote $FLAGS 2>&1 | tee /tmp/seed.log; then
            echo "✅ D1 REST API 灌库成功"
            echo "### ✅ 合规规则灌库成功" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/seed.log >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ D1 REST API 灌库失败"
              echo ""
              echo '```'
              cat /tmp/seed.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::D1 REST API 失败, 回退到 wrangler d1 execute"

            # ── 回退: wrangler(认证路径不同, 某些 token REST 401 但 wrangler 能通) ──
            cd query/worker
            npm ci
            if ! npx wrangler d1 execute siliao-db --remote --file migrate_c1.sql 2>&1 | tee /tmp/wrangler.log; then
              {
                echo ""
                echo "## ❌ wrangler 建表也失败"
                echo ""
                echo '```'
                cat /tmp/wrangler.log || true
                echo '```'
                echo ""
                echo "**结论**: 当前的 \`CLOUDFLARE_API_TOKEN\` secret **没有 D1 写权限**。"
                echo "需要新建一个带 \`Account → D1 → Edit\` 权限的 API Token。"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::建表失败 —— 需要有 D1 编辑权限的 token"
              exit 1
            fi
            cd ../..

            # SQL 文件由 seed_compliance.py 在失败前写出; 若没生成则先生成
            if [ ! -f build/export/compliance_rules.sql ]; then
              python - <<'PYEOF'
          import io, json, sys
          sys.path.insert(0, "build/export")
          from seed_compliance import write_sql_files
          rules = json.load(io.open("build/export/compliance_rules.json", encoding="utf-8"))
          cat = json.load(io.open("build/export/substance_catalog.json", encoding="utf-8"))
          status = "reviewed" if "${MARK:-false}" == "true" else "pending"
          write_sql_files(rules.get("rule_set_version", "v2026.10"), rules["rules"], cat["substances"], status)
          PYEOF
            fi

            cd query/worker
            npx wrangler d1 execute siliao-db --remote --file ../../build/export/compliance_rules.sql
            npx wrangler d1 execute siliao-db --remote --file ../../build/export/substance_catalog.sql
          fi

      - name: 回读校验
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, sys, urllib.request
          sys.path.insert(0, "build/export")
          from seed_compliance import api_request, load_account_token, ACCOUNT_ID, DB_ID

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          path = f"/accounts/{ACCOUNT_ID}/d1/database/{DB_ID}/query"

          def q(sql, params=None):
              body = {"sql": sql}
              if params: body["params"] = params
              return api_request(path, token, "POST", body)

          r = q("SELECT COUNT(*) c FROM compliance_rules")
          rules = r.get("result", [{}])[0].get("c", 0)
          r = q("SELECT COUNT(*) c FROM substance_catalog")
          cat = r.get("result", [{}])[0].get("c", 0)
          r = q("SELECT COUNT(*) c FROM compliance_rules WHERE source_article_id IS NULL OR source_article_id=''")
          bad = r.get("result", [{}])[0].get("c", 0)

          print(f"compliance_rules   : {rules}")
          print(f"substance_catalog  : {cat}")
          print(f"无溯源的规则        : {bad}")

          assert rules > 0, "规则数为 0 —— 抽取没产出"
          assert cat > 0, "物质目录为 0"
          assert bad == 0, f"有 {bad} 条规则没有溯源 —— 违反不变量 2"
          print("✅ 灌库校验通过")
          EOF

# CI: 任何 push/PR 都跑,保证 main 永远是绿色
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 前端测试 =====
  web-test:
    name: Web · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  # ===== 前端 build =====
  web-build:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: 上传 dist 供后续 job 用
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ===== 前端 e2e =====
  web-e2e:
    name: Web · playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 跑 e2e
        run: npm run e2e
      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      - name: 上传失败 trace/screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 3

  # ===== Worker typecheck =====
  worker-typecheck:
    name: Worker · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: query/worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ===== Python eval =====
  eval:
    name: Eval · retrieval + faithfulness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成 seed.sql
        run: python build/export/seed_d1.py data/markdown/feed-law-2026/articles.json data/markdown/feed-law-2026/chapters.json
      - name: 跑 retrieval eval
        run: python evals/eval_retrieval.py
      - name: 跑 faithfulness eval
        run: python evals/eval_qa_faithfulness.py
      - name: 上传 eval 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: evals/retrieval_report.md
          retention-days: 30

# Deploy: main 分支 push 后自动部署
#
# 前置 secrets(在 GitHub repo Settings → Secrets):
#   CLOUDFLARE_API_TOKEN   Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Pages/Workers
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare Dashboard 右下角
#   DEEPSEEK_API_KEY       DeepSeek / MiniMax API key(Worker 运行时需要)
#
# Pages project 在 Cloudflare Dashboard 配 GitHub 集成后,这里再 build 是冗余;
# 保留是为了失败时手动重试。
name: Deploy

on:
  push:
    branches: [main, "deploy/**"]
    # 跳过 ci.yml 触发的 commits,避免双跑
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # 部署不打断

jobs:
  # ===== Worker 部署 =====
  worker:
    name: Worker · wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: query/worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: 配置 wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: query/worker
          # secret 在 wrangler secret put 命令里设,不在这里
          # ⚠️ 2026-10-26: 不要加 --non-interactive —— wrangler 4.127 不认这个
          #    flag, 会直接报 "Unknown argument"。wrangler-action 自己会传
          #    --non-interactive 给内部命令,不能在这里再叠。
          command: deploy

  # ===== 前端 Pages 部署 =====
  pages:
    name: Pages · vite build + deploy
    runs-on: ubuntu-latest
    needs: worker  # Worker 先部署,Pages env 里指过去
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd web && npm ci
      # 前端 mockData 通过 import.meta.glob 加载 data/index/minimax/ 下的
      # 逐条 markdown —— 那是 gitignore 的可重生成产物, 构建前必须先摄入。
      - name: 生成索引产物(mockData 数据源)
        run: |
          python build/export/ingest_minimax.py
      # ⚠️ VITE_USE_MOCK=false 是必须的 —— 否则线上加载 mock 语料,
      #    页面看起来"能用"但其实没连 Worker。
      - run: cd web && npx tsc --noEmit
      - run: cd web && VITE_USE_MOCK=false npm run build
      # ⚠️ 不用 cloudflare/pages-action —— 它只传静态目录, **不打包
      #    web/functions/**, Pages Functions 代理(web/functions/api/[[path]].ts)
      #    会丢, 前端就拿不到 API(页面能开, 搜索全空)。
      #    wrangler pages deploy 会把 functions/ 一起打成 Functions bundle。
      - name: 部署到 Cloudflare Pages
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name siliao-web \
            --branch main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 确认 Functions bundle 已上传
        run: |
          npx wrangler@4 pages deployment list --project-name siliao-web | head -5
          # Environment variables 在 Pages Dashboard 配更安全,不进 yaml

  # ===== Worker secrets 同步 =====
  # 第一次部署需要手动 wrangler secret put DEEPSEEK_API_KEY
  # 后续改 key 直接在 Cloudflare Dashboard → Workers → Settings → Variables
  # 这里不重复自动化(避免 CI 复杂度)
  worker-secrets:
    name: Worker · secrets reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 提示
        run: |
          echo "::notice::Worker secrets 在 Cloudflare Dashboard 管理"
          echo "Workers → siliao-api → Settings → Variables → DEEPSEEK_API_KEY"

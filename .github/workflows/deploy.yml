# Deploy: main 分支 push 后自动部署
#
# 前置 secrets(在 GitHub repo Settings → Secrets):
#   CLOUDFLARE_API_TOKEN   Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Pages/Workers
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare Dashboard 右下角
#   DEEPSEEK_API_KEY       DeepSeek / MiniMax API key(Worker 运行时需要)
#
# Pages project 在 Cloudflare Dashboard 配 GitHub 集成后,这里再 build 是冗余;
# 保留是为了失败时手动重试。
name: Deploy

on:
  push:
    branches: [main, "deploy/**"]
  # 手动触发(改完配置想立刻重部署时用):
  #   gh workflow run deploy.yml --ref deploy/c-b-hybrid
  workflow_dispatch:
    # 跳过 ci.yml 触发的 commits,避免双跑
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # 部署不打断

jobs:
  # ===== Worker 部署 =====
  worker:
    name: Worker · wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: query/worker/package-lock.json
      # 刷新凭据那步用 python3 解析 JSON —— ubuntu-latest 自带, 但显式装一下更稳
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npx tsc --noEmit
      # ⚠️ 前置检查: secret 没配就直接说清楚, 别让 wrangler 拿着空 token
      #    去 Cloudflare API 报一句看不懂的 400。
      - name: 检查 Cloudflare 凭据
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::仓库缺少 Cloudflare secrets。请在 Settings → Secrets and"
            echo "::error::variables → Actions 新建这两个(仓库需 admin 权限):"
            echo "::error::  CLOUDFLARE_API_TOKEN   (Dashboard → My Profile → API Tokens →"
            echo "::error::   Edit Cloudflare Workers, 模板 'Edit Cloudflare Workers')"
            echo "::error::  CLOUDFLARE_ACCOUNT_ID  (Dashboard 右下角, 形如 1b938cc261b000a03554b506985daabb)"
            exit 1
          fi
          echo "✅ Cloudflare 凭据已配置"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ⚠️ 2026-10-26: 不用 cloudflare/wrangler-action@v3 —— 它在
      #    "配置 wrangler" 这一步就挂了(装 wrangler + 登录鉴权, v3 对
      #    新版 wrangler 4.x 的兼容性有问题), 报错信息还被吞在 action 里。
      #    改成直接用 npx + 环境变量鉴权, 报错直白可见。
      # ⚠️ 凭据预检 —— 2026-10-27 踩过:
      #    OAuth token(wrangler login 拿的)**1 小时就过期**, 存在 secret 里
      #    迟早失效, 部署就挂在 "Invalid access token [code: 9109]"。
      #    看着像权限不够, 实际是过期 —— 排查绕了一圈。
      #
      #    现在用的是 Dashboard 建��**永不过期的 API Token**
      #    (TTL 留空, 见 docs/cloudflare-token-setup-guide.html), 不会再过期。
      #    这里只做预检: 万一 token 被误删/误改, 提前说清楚。
      - name: 预检 Cloudflare 凭据
        id: cf
        run: |
          code=$(curl -s -o /tmp/cf.json -w "%{http_code}" -m 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare API 返回 $code —— token 无效或已撤销"
            echo "::error::$(head -c 300 /tmp/cf.json)"
            echo "::error::修复: 在 Dashboard 重新建一个 API Token(TTL 留空),"
            echo "::error::更新仓库 secret CLOUDFLARE_API_TOKEN。"
            echo "::error::步骤见 docs/cloudflare-token-setup-guide.html"
            exit 1
          fi
          echo "✅ Cloudflare 凭据有效"
          echo "token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 部署 Worker
        run: npx wrangler@4 deploy
        working-directory: query/worker
        env:
          # 用刷新后的 token(不是 secret 里那个可能已过期的)
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 校验部署结果
        # 部署完必须回读一次 —— 退出码 0 不等于 Worker 真的活了
        run: |
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors \
            "https://siliao-api.guoguoping.workers.dev/api/documents" \
            -o /tmp/docs.json
          python -c "
          import json
          n = len(json.load(open('/tmp/docs.json'))['documents'])
          print(f'✅ 生产 API 活着, {n} 份文档')
          assert n > 100, f'文档数异常: {n}'
          "

  # ===== 前端 Pages 部署 =====
  pages:
    name: Pages · vite build + deploy
    runs-on: ubuntu-latest
    needs: worker  # Worker 先部署,Pages env 里指过去
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd web && npm ci
      # 前端 mockData 通过 import.meta.glob 加载 data/index/minimax/ 下的
      # 逐条 markdown —— 那是 gitignore 的可重生成产物, 构建前必须先摄入。
      - name: 生成索引产物(mockData 数据源)
        run: |
          python build/export/ingest_minimax.py
      # ⚠️ VITE_USE_MOCK=false 是必须的 —— 否则线上加载 mock 语料,
      #    页面看起来"能用"但其实没连 Worker。
      - run: cd web && npx tsc --noEmit
      - run: cd web && VITE_USE_MOCK=false npm run build
      # ⚠️ 不用 cloudflare/pages-action —— 它只传静态目录, **不打包
      #    web/functions/**, Pages Functions 代理(web/functions/api/[[path]].ts)
      #    会丢, 前端就拿不到 API(页面能开, 搜索全空)。
      #    wrangler pages deploy 会把 functions/ 一起打成 Functions bundle。
      - name: 部署到 Cloudflare Pages
        # ⚠️ **必须在 web/ 目录下跑** —— dist 在 web/dist, 在仓库根跑会
        #    报 "ENOENT: no such file or directory, scandir '.../siliao/dist'"。
        #    而且必须从 web/ 跑才能把 web/functions/ 一起打成 Functions bundle
        #    (Pages Functions 代理丢了, 前端就拿不到 API)。
        working-directory: web
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name siliao-web \
            --branch main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 确认 Functions bundle 已上传
        run: |
          npx wrangler@4 pages deployment list --project-name siliao-web | head -5
          # Environment variables 在 Pages Dashboard 配更安全,不进 yaml

  # ===== Worker secrets 同步 =====
  # 第一次部署需要手动 wrangler secret put DEEPSEEK_API_KEY
  # 后续改 key 直接在 Cloudflare Dashboard → Workers → Settings → Variables
  # 这里不重复自动化(避免 CI 复杂度)
  worker-secrets:
    name: Worker · secrets reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 提示
        run: |
          echo "::notice::Worker secrets 在 Cloudflare Dashboard 管理"
          echo "Workers → siliao-api → Settings → Variables → DEEPSEEK_API_KEY"

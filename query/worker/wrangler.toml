name = "siliao-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# R2: 索引产物 (entities.json / relationships.json 等)
[[r2_buckets]]
binding = "INDEX_BUCKET"
bucket_name = "siliao-index"
remote = true

# D1: 文档与章节元数据
[[d1_databases]]
binding = "DB"
database_name = "siliao-db"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"
remote = true

# Vectorize: bge-large-zh 1024 维向量
[[vectorize]]
binding = "VECTOR"
index_name = "feed-law-index"

# Workers AI: 用作 query-time rerank (可选)
[ai]
binding = "AI"

[vars]
DEEPSEEK_API_BASE = "https://api.deepseek.com/v1"
DEEPSEEK_MODEL = "deepseek-chat"
# bge 语义检索服务 —— nginx 反代配置
#
# 装到: /usr/local/nginx/conf/conf.d/ns.hbnongfengyuan.cn.conf
#
# 为什么复用 ns.hbnongfengyuan.cn:
#   - 该子域 DNS 已解析到本机(47.108.112.118)
#   - 证书 ns.hbnongfengyuan.cn.pem 有效到 2026-12-22, SAN 覆盖 ns + www.ns
#   - 原站点反代 127.0.0.1:9999, 而 9999 端口空置(原业务已下线, 返回 502)
#   → 直接把它改指向 bge 容器, 不需要动 DNS、不需要签新证书
#
# 只有 /v1/search 和 /health 暴露, 挡住 /v1/embeddings(不需要对外)

server {
    listen 80;
    listen 443 ssl;
    server_name ns.hbnongfengyuan.cn;
    ssl_certificate     /usr/local/nginx/cert/ns.hbnongfengyuan.cn.pem;
    ssl_certificate_key /usr/local/nginx/cert/ns.hbnongfengyuan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/bge.access.log;
    error_log  /var/log/nginx/bge.error.log;

    # bge 单 query 检索 <100ms, 但首次冷启动(模型已在内存)给 60s 余量
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    location = /v1/search {
        proxy_pass http://127.0.0.1:8080/v1/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Worker 端是 POST JSON
        client_max_body_size 1m;
    }

    # 其余路径一律 404 —— 不暴露 embeddings 端点
    location / {
        return 404 '{"error":"not_found"}';
    }
}
